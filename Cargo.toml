[package]
name        = "encipher"
version     = "2.0.0"
edition     = "2021"
description = "A fast, allocation-conscious session-data cipher for Rust, built entirely on audited AEAD primitives (AES-256-GCM, XChaCha20-Poly1305)."
license     = "Apache-2.0"
repository  = "https://github.com/mjlad/encipher"
readme      = "README.md"
keywords    = ["encryption", "session", "cipher", "aead", "security"]
categories  = ["cryptography", "encoding"]

[lib]
name       = "encipher"
crate-type = ["rlib"]

[dependencies]
thiserror = "2"
sha2      = "0.10"
base64ct  = { version = "1.8", features = ["alloc"] }
rand      = { version = "0.10", features = ["chacha"] }
aes-gcm           = "0.10"
chacha20poly1305  = "0.10"

[features]
# Exposes internals (currently just `aad`) that have no business being
# public in an ordinary build, but that a fuzz harness in fuzz/ needs to
# reach directly rather than only through the token format's outer shell.
fuzzing = []

[profile.release]
opt-level     = 3
lto           = true
codegen-units = 1